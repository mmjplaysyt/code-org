<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hour of AI — CodePulse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #09090b; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #52525b; }
        ::selection { background: #eab308; color: #000; }
        .text-gradient { background: linear-gradient(to right, #facc15, #ca8a04); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .glow-text { text-shadow: 0 0 20px rgba(250,204,21,0.3); }
        .code-editor { background: #09090b; border: 1px solid #27272a; font-family: 'Courier New', monospace; }
        .code-editor:focus { border-color: rgba(234,179,8,0.5); outline: none; box-shadow: 0 0 20px rgba(234,179,8,0.1); }
        .step-dot { transition: all 300ms; }
        .step-dot.active { background: #eab308; box-shadow: 0 0 10px rgba(234,179,8,0.5); }
        .step-dot.completed { background: #22c55e; }
        .step-content { animation: fadeInUp 0.4s ease-out; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse-ring { 0% { transform: scale(1); opacity: 0.6; } 100% { transform: scale(2); opacity: 0; } }
        .pulse-ring::before { content: ''; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid #eab308; animation: pulse-ring 1.5s ease-out infinite; }
        @keyframes typewriter { from { width: 0; } to { width: 100%; } }
        .neuron-pulse { animation: neuronPulse 1s ease-in-out infinite alternate; }
        @keyframes neuronPulse { from { opacity: 0.4; transform: scale(0.9); } to { opacity: 1; transform: scale(1.1); } }
        .data-flow { animation: dataFlow 2s linear infinite; }
        @keyframes dataFlow { 0% { stroke-dashoffset: 20; } 100% { stroke-dashoffset: 0; } }
        .quiz-option { transition: all 200ms; }
        .quiz-option:hover { border-color: rgba(234,179,8,0.5); background: rgba(234,179,8,0.05); }
        .quiz-option.correct { border-color: #22c55e; background: rgba(34,197,94,0.1); }
        .quiz-option.wrong { border-color: #ef4444; background: rgba(239,68,68,0.1); }
        .quiz-option.disabled { pointer-events: none; opacity: 0.5; }
        .output-line { animation: fadeInUp 0.3s ease-out; }
        .sidebar-scroll { scrollbar-width: thin; scrollbar-color: #3f3f46 transparent; }
        .sidebar-scroll::-webkit-scrollbar { width: 4px; }
        .sidebar-scroll::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 2px; }
    </style>
</head>
<body class="bg-black text-white overflow-hidden h-screen">

    <!-- Top Bar -->
    <header class="fixed top-0 left-0 right-0 z-50 h-14 flex items-center bg-zinc-950 border-b border-zinc-800">
        <div class="flex items-center justify-between w-full px-4">
            <div class="flex items-center gap-4">
                <a href="index.html" class="flex items-center gap-2 text-zinc-400 hover:text-white transition-colors">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i>
                    <span class="text-[10px] font-bold tracking-widest uppercase hidden sm:inline">Back</span>
                </a>
                <div class="w-px h-6 bg-zinc-800"></div>
                <div class="flex flex-col leading-tight">
                    <span class="text-sm font-black italic tracking-tighter">CODE<span class="text-yellow-500">PULSE</span></span>
                </div>
                <div class="w-px h-6 bg-zinc-800 hidden sm:block"></div>
                <span class="text-xs font-semibold text-zinc-400 hidden sm:block">Hour of AI</span>
            </div>
            <div class="flex items-center gap-4">
                <!-- Progress Bar -->
                <div class="hidden sm:flex items-center gap-2">
                    <span id="progress-text" class="text-[10px] font-bold tracking-widest uppercase text-zinc-500">1/100</span>
                    <div class="w-32 h-1.5 bg-zinc-800 rounded-full overflow-hidden">
                        <div id="progress-bar" class="h-full bg-yellow-500 rounded-full transition-all duration-500" style="width: 1%"></div>
                    </div>
                </div>
                <div class="sm:hidden">
                    <span id="progress-text-mobile" class="text-[10px] font-bold tracking-widest uppercase text-yellow-500">1%</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Layout -->
    <div class="flex pt-14 h-screen">

        <!-- Sidebar: Step Navigation -->
        <aside id="sidebar" class="hidden lg:flex flex-col w-64 flex-shrink-0 border-r border-zinc-900 bg-zinc-950/80">
            <div class="p-4 border-b border-zinc-900">
                <h3 class="text-[10px] font-bold tracking-widest uppercase text-zinc-500 mb-1">Progress</h3>
                <div class="flex items-center gap-2">
                    <div class="flex-1 h-1.5 bg-zinc-800 rounded-full overflow-hidden">
                        <div id="sidebar-progress" class="h-full bg-yellow-500 rounded-full transition-all duration-500" style="width:1%"></div>
                    </div>
                    <span id="sidebar-pct" class="text-[10px] font-bold text-yellow-500">1%</span>
                </div>
            </div>
            <div id="step-list" class="flex-1 overflow-y-auto sidebar-scroll p-3">
                <!-- Populated by JS -->
            </div>
            <div class="p-4 border-t border-zinc-900">
                <div class="flex items-center gap-2 text-zinc-600">
                    <i data-lucide="info" class="w-3 h-3"></i>
                    <span class="text-[10px] font-semibold">100 steps · ~60 min</span>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 overflow-y-auto" id="main-scroll">
            <div class="max-w-3xl mx-auto px-6 py-10">
                <div id="step-container">
                    <!-- Steps injected by JS -->
                </div>

                <!-- Navigation Buttons -->
                <div class="flex items-center justify-between mt-10 pb-10">
                    <button id="btn-prev" onclick="goStep(currentStep-1)" class="flex items-center gap-2 text-xs font-bold tracking-wider uppercase text-zinc-500 hover:text-white border border-zinc-800 px-5 py-2.5 rounded-sm hover:border-zinc-600 transition-all duration-150 disabled:opacity-30 disabled:pointer-events-none">
                        <i data-lucide="chevron-left" class="w-4 h-4"></i>
                        <span>Back</span>
                    </button>
                    <button id="btn-next" onclick="goStep(currentStep+1)" class="flex items-center gap-2 text-xs font-bold tracking-wider uppercase bg-yellow-500 text-black px-6 py-2.5 rounded-sm hover:bg-yellow-400 hover:shadow-[0_0_30px_rgba(234,179,8,0.3)] transition-all duration-150">
                        <span>Next</span>
                        <i data-lucide="chevron-right" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- Mobile Step Toggle -->
    <button id="mobile-step-btn" class="lg:hidden fixed bottom-6 left-6 z-40 w-12 h-12 bg-zinc-900 border border-zinc-700 rounded-full flex items-center justify-center shadow-2xl" onclick="toggleMobileSteps()">
        <i data-lucide="list" class="w-5 h-5 text-yellow-500"></i>
    </button>

    <!-- Mobile Step Panel -->
    <div id="mobile-steps" class="lg:hidden fixed inset-0 z-50 bg-black/95 hidden">
        <div class="flex items-center justify-between p-4 border-b border-zinc-800">
            <span class="text-xs font-bold tracking-wider uppercase text-zinc-400">All Steps</span>
            <button onclick="toggleMobileSteps()" class="text-zinc-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        <div id="mobile-step-list" class="overflow-y-auto h-[calc(100vh-60px)] p-4 sidebar-scroll"></div>
    </div>

<script>
// ============================================================
// 100 STEPS DATA — Hour of AI Curriculum
// ============================================================
const steps = [
    // SECTION 1: Welcome (Steps 1-5)
    { type:'welcome', section:'Welcome',
      title:'Welcome to Hour of AI',
      body:`<p class="text-lg font-light text-zinc-300 leading-relaxed mb-4">You're about to learn how Artificial Intelligence actually works — not the hype, not the buzzwords, but the real stuff.</p>
      <p class="text-sm text-zinc-400 font-light leading-relaxed mb-6">In the next 100 steps, you'll build your own AI from scratch. No experience needed. Just curiosity.</p>
      <div class="bg-zinc-900/50 border border-zinc-800 rounded-sm p-5">
        <div class="flex items-start gap-3"><i data-lucide="lightbulb" class="w-5 h-5 text-yellow-500 mt-0.5 flex-shrink-0"></i>
        <div><p class="text-sm text-zinc-300 font-light">You'll write code, solve puzzles, and build a working AI chatbot — all in your browser. Every step teaches one concept.</p></div></div>
      </div>`},

    { type:'info', section:'Welcome',
      title:'What You\'ll Build',
      body:`<p class="text-sm text-zinc-400 font-light leading-relaxed mb-6">By the end of this course, you will have:</p>
      <div class="space-y-3">
        <div class="flex items-start gap-3 bg-zinc-900/30 border border-zinc-800 rounded-sm p-4"><span class="text-yellow-500 font-bold text-lg">01</span><p class="text-sm text-zinc-300 font-light">Understood how AI "learns" from data</p></div>
        <div class="flex items-start gap-3 bg-zinc-900/30 border border-zinc-800 rounded-sm p-4"><span class="text-yellow-500 font-bold text-lg">02</span><p class="text-sm text-zinc-300 font-light">Built a neural network by hand</p></div>
        <div class="flex items-start gap-3 bg-zinc-900/30 border border-zinc-800 rounded-sm p-4"><span class="text-yellow-500 font-bold text-lg">03</span><p class="text-sm text-zinc-300 font-light">Trained it to recognize patterns</p></div>
        <div class="flex items-start gap-3 bg-zinc-900/30 border border-zinc-800 rounded-sm p-4"><span class="text-yellow-500 font-bold text-lg">04</span><p class="text-sm text-zinc-300 font-light">Created your own AI chatbot</p></div>
        <div class="flex items-start gap-3 bg-zinc-900/30 border border-zinc-800 rounded-sm p-4"><span class="text-yellow-500 font-bold text-lg">05</span><p class="text-sm text-zinc-300 font-light">Earned your Hour of AI certificate</p></div>
      </div>`},

    { type:'info', section:'Welcome',
      title:'How This Course Works',
      body:`<p class="text-sm text-zinc-400 font-light leading-relaxed mb-5">Each step teaches one concept. There are different types of steps:</p>
      <div class="grid grid-cols-2 gap-3 mb-5">
        <div class="bg-zinc-900/30 border border-zinc-800 rounded-sm p-4 text-center"><i data-lucide="book-open" class="w-5 h-5 text-blue-400 mx-auto mb-2"></i><p class="text-[10px] font-bold tracking-wider uppercase text-zinc-400">Learn</p><p class="text-xs text-zinc-500 mt-1">Read & understand</p></div>
        <div class="bg-zinc-900/30 border border-zinc-800 rounded-sm p-4 text-center"><i data-lucide="code-2" class="w-5 h-5 text-green-400 mx-auto mb-2"></i><p class="text-[10px] font-bold tracking-wider uppercase text-zinc-400">Code</p><p class="text-xs text-zinc-500 mt-1">Write real code</p></div>
        <div class="bg-zinc-900/30 border border-zinc-800 rounded-sm p-4 text-center"><i data-lucide="help-circle" class="w-5 h-5 text-yellow-400 mx-auto mb-2"></i><p class="text-[10px] font-bold tracking-wider uppercase text-zinc-400">Quiz</p><p class="text-xs text-zinc-500 mt-1">Test knowledge</p></div>
        <div class="bg-zinc-900/30 border border-zinc-800 rounded-sm p-4 text-center"><i data-lucide="flask-conical" class="w-5 h-5 text-purple-400 mx-auto mb-2"></i><p class="text-[10px] font-bold tracking-wider uppercase text-zinc-400">Lab</p><p class="text-xs text-zinc-500 mt-1">Experiments</p></div>
      </div>
      <div class="bg-yellow-500/10 border border-yellow-500/20 rounded-sm p-4 flex items-start gap-3"><i data-lucide="zap" class="w-4 h-4 text-yellow-500 mt-0.5 flex-shrink-0"></i><p class="text-sm text-yellow-500/90 font-light">Click "Next" to move through each step. You can always go back.</p></div>`},

    { type:'quiz', section:'Welcome',
      title:'Quick Check: Ready?',
      question:'Artificial Intelligence is...',
      options:['A robot with feelings','A computer program that can learn from data','A replacement for all human jobs','Only used by big tech companies'],
      correct:1,
      explanation:'AI is software that can learn patterns from data and make decisions — no feelings required!'},

    { type:'info', section:'Welcome',
      title:'Let\'s Begin!',
      body:`<div class="text-center py-8">
        <div class="w-20 h-20 mx-auto rounded-full bg-yellow-500/10 border border-yellow-500/30 flex items-center justify-center mb-6 relative pulse-ring"><i data-lucide="rocket" class="w-8 h-8 text-yellow-500"></i></div>
        <h3 class="text-2xl font-bold tracking-tight uppercase mb-3">Section 1 Complete</h3>
        <p class="text-sm text-zinc-400 font-light">Next up: We'll learn what AI actually is by comparing it to something you already know — how <span class="text-yellow-500 font-semibold">you</span> learn.</p>
      </div>`},

    // SECTION 2: What Is AI? (Steps 6-15)
    { type:'info', section:'What Is AI?',
      title:'Think Like a Human',
      body:`<p class="text-sm text-zinc-400 font-light leading-relaxed mb-5">How did you learn to recognize a cat?</p>
      <div class="space-y-3 mb-5">
        <div class="flex items-center gap-3"><div class="w-8 h-8 rounded-full bg-zinc-800 border border-zinc-700 flex items-center justify-center text-xs font-bold text-yellow-500">1</div><p class="text-sm text-zinc-300 font-light">You saw many cats (your parents pointed at them)</p></div>
        <div class="flex items-center gap-3"><div class="w-8 h-8 rounded-full bg-zinc-800 border border-zinc-700 flex items-center justify-center text-xs font-bold text-yellow-500">2</div><p class="text-sm text-zinc-300 font-light">Your brain noticed patterns: pointy ears, whiskers, tail</p></div>
        <div class="flex items-center gap-3"><div class="w-8 h-8 rounded-full bg-zinc-800 border border-zinc-700 flex items-center justify-center text-xs font-bold text-yellow-500">3</div><p class="text-sm text-zinc-300 font-light">Now you can recognize any cat — even ones you've never seen</p></div>
      </div>
      <div class="bg-zinc-900/50 border border-zinc-800 rounded-sm p-5"><p class="text-sm text-yellow-500 font-medium">AI learns the <strong>exact same way</strong>. It looks at examples, finds patterns, then recognizes new things.</p></div>`},

    { type:'info', section:'What Is AI?',
      title:'AI vs Traditional Software',
      body:`<p class="text-sm text-zinc-400 font-light leading-relaxed mb-5">There's a huge difference between regular software and AI:</p>
      <div class="grid grid-cols-2 gap-4 mb-5">
        <div class="border border-zinc-800 rounded-sm p-5">
          <p class="text-[10px] font-bold tracking-widest uppercase text-zinc-500 mb-3">Regular Software</p>
          <p class="text-sm text-zinc-300 font-light mb-2">Human writes <strong>explicit rules</strong></p>
          <div class="code-editor rounded-sm p-3 text-xs"><span class="text-zinc-500">// Human wrote this rule:</span><br><span class="text-blue-400">if</span> (animal == <span class="text-green-400">"cat"</span>) {<br>&nbsp;&nbsp;say(<span class="text-green-400">"Meow!"</span>);<br>}</div>
        </div>
        <div class="border border-yellow-500/30 rounded-sm p-5 bg-yellow-500/5">
          <p class="text-[10px] font-bold tracking-widest uppercase text-yellow-500 mb-3">AI Software</p>
          <p class="text-sm text-zinc-300 font-light mb-2">AI <strong>discovers rules</strong> from data</p>
          <div class="code-editor rounded-sm p-3 text-xs"><span class="text-zinc-500">// AI figured this out:</span><br><span class="text-blue-400">if</span> (has_whiskers && has_tail) {<br>&nbsp;&nbsp;say(<span class="text-green-400">"Probably a cat"</span>);<br>}</div>
        </div>
      </div>
      <p class="text-sm text-zinc-400 font-light">Regular software: <strong>you</strong> write the rules. AI: the <strong>machine</strong> finds the rules.</p>`},

    { type:'quiz', section:'What Is AI?',
      title:'Quiz: Rules vs Learning',
      question:'A spam filter that checks if an email contains the word "FREE" is...',
      options:['AI (it learned from data)','Regular software (human wrote the rule)','Both','Neither'],
      correct:1,
      explanation:'Checking for a specific word is a human-written rule. A true AI spam filter would learn what spam looks like from thousands of examples.'},

    { type:'info', section:'What Is AI?',
      title:'The Three Ingredients of AI',
      body:`<p class="text-sm text-zinc-400 font-light leading-relaxed mb-5">Every AI system needs exactly three things:</p>
      <div class="space-y-4">
        <div class="flex items-start gap-4 bg-zinc-900/30 border border-zinc-800 rounded-sm p-5">
          <div class="w-12 h-12 rounded-full bg-blue-500/10 border border-blue-500/30 flex items-center justify-center flex-shrink-0"><i data-lucide="database" class="w-5 h-5 text-blue-400"></i></div>
          <div><h4 class="text-sm font-bold mb-1">1. Data</h4><p class="text-sm text-zinc-400 font-light">Thousands of examples — images, text, numbers, anything.</p></div>
        </div>
        <div class="flex items-start gap-4 bg-zinc-900/30 border border-zinc-800 rounded-sm p-5">
          <div class="w-12 h-12 rounded-full bg-green-500/10 border border-green-500/30 flex items-center justify-center flex-shrink-0"><i data-lucide="cpu" class="w-5 h-5 text-green-400"></i></div>
          <div><h4 class="text-sm font-bold mb-1">2. Model</h4><p class="text-sm text-zinc-400 font-light">A mathematical structure that can find patterns (like a brain).</p></div>
        </div>
        <div class="flex items-start gap-4 bg-zinc-900/30 border border-zinc-800 rounded-sm p-5">
          <div class="w-12 h-12 rounded-full bg-purple-500/10 border border-purple-500/30 flex items-center justify-center flex-shrink-0"><i data-lucide="trending-up" class="w-5 h-5 text-purple-400"></i></div>
          <div><h4 class="text-sm font-bold mb-1">3. Training</h4><p class="text-sm text-zinc-400 font-light">The process of feeding data to the model so it learns patterns.</p></div>
        </div>
      </div>`},

    { type:'interactive', section:'What Is AI?',
      title:'Match: AI or Not AI?',
      body:`<p class="text-sm text-zinc-400 font-light mb-5">Drag each example to the correct category. Click to classify:</p>`,
      interactiveType:'classify',
      items:['Netflix movie recommendations','A calculator doing 2+2','Self-driving car','A light switch','Google Translate','A clock showing time'],
      categories:['AI','Not AI'],
      answers:['AI','Not AI','AI','Not AI','AI','Not AI']},

    { type:'info', section:'What Is AI?',
      title:'Types of AI You Use Daily',
      body:`<p class="text-sm text-zinc-400 font-light leading-relaxed mb-5">You already interact with AI every day without realizing it:</p>
      <div class="space-y-2 mb-5">
        <div class="flex items-center gap-3 p-3 bg-zinc-900/30 border border-zinc-800 rounded-sm"><i data-lucide="search" class="w-4 h-4 text-yellow-500 flex-shrink-0"></i><span class="text-sm text-zinc-300 font-light"><strong class="text-white">Google Search</strong> — AI ranks the best results for your query</span></div>
        <div class="flex items-center gap-3 p-3 bg-zinc-900/30 border border-zinc-800 rounded-sm"><i data-lucide="mic" class="w-4 h-4 text-yellow-500 flex-shrink-0"></i><span class="text-sm text-zinc-300 font-light"><strong class="text-white">Siri / Alexa</strong> — AI converts your voice to text and understands meaning</span></div>
        <div class="flex items-center gap-3 p-3 bg-zinc-900/30 border border-zinc-800 rounded-sm"><i data-lucide="image" class="w-4 h-4 text-yellow-500 flex-shrink-0"></i><span class="text-sm text-zinc-300 font-light"><strong class="text-white">Face ID</strong> — AI maps 30,000 points on your face</span></div>
        <div class="flex items-center gap-3 p-3 bg-zinc-900/30 border border-zinc-800 rounded-sm"><i data-lucide="message-circle" class="w-4 h-4 text-yellow-500 flex-shrink-0"></i><span class="text-sm text-zinc-300 font-light"><strong class="text-white">ChatGPT</strong> — AI predicts the next word in a conversation</span></div>
        <div class="flex items-center gap-3 p-3 bg-zinc-900/30 border border-zinc-800 rounded-sm"><i data-lucide="music" class="w-4 h-4 text-yellow-500 flex-shrink-0"></i><span class="text-sm text-zinc-300 font-light"><strong class="text-white">Spotify Discover</strong> — AI learns your music taste from listening history</span></div>
      </div>`},

    { type:'quiz', section:'What Is AI?',
      title:'Quiz: AI Types',
      question:'Which of these is NOT powered by AI?',
      options:['Your phone predicting what word you\'ll type next','A password checking if it matches exactly','Instagram showing you posts you might like','TikTok\'s "For You" page'],
      correct:1,
      explanation:'Exact password matching is a simple comparison — no learning involved. The other three all use AI to learn your preferences.'},

    { type:'info', section:'What Is AI?',
      title:'AI Can\'t Do Everything',
      body:`<p class="text-sm text-zinc-400 font-light leading-relaxed mb-5">AI is powerful, but it has real limitations:</p>
      <div class="grid grid-cols-2 gap-3 mb-5">
        <div class="border border-green-500/20 rounded-sm p-4 bg-green-500/5"><p class="text-[10px] font-bold tracking-widest uppercase text-green-400 mb-2">✓ Good At</p>
        <ul class="space-y-1.5 text-xs text-zinc-300 font-light"><li>• Finding patterns in data</li><li>• Repetitive tasks at scale</li><li>• Image/text recognition</li><li>• Making predictions</li></ul></div>
        <div class="border border-red-500/20 rounded-sm p-4 bg-red-500/5"><p class="text-[10px] font-bold tracking-widest uppercase text-red-400 mb-2">✗ Bad At</p>
        <ul class="space-y-1.5 text-xs text-zinc-300 font-light"><li>• Understanding context</li><li>• Being creative (truly)</li><li>• Explaining why it decided</li><li>• Having common sense</li></ul></div>
      </div>
      <div class="bg-zinc-900/50 border border-zinc-800 rounded-sm p-4 flex items-start gap-3"><i data-lucide="alert-triangle" class="w-4 h-4 text-yellow-500 mt-0.5 flex-shrink-0"></i><p class="text-sm text-zinc-300 font-light">AI can confidently give wrong answers. This is called a <strong class="text-white">"hallucination."</strong> Always verify AI output.</p></div>`},

    { type:'info', section:'What Is AI?',
      title:'Narrow AI vs General AI',
      body:`<p class="text-sm text-zinc-400 font-light leading-relaxed mb-5">All AI that exists today is "Narrow AI":</p>
      <div class="space-y-4 mb-5">
        <div class="border border-zinc-800 rounded-sm p-5">
          <div class="flex items-center gap-2 mb-2"><div class="w-3 h-3 bg-green-500 rounded-full"></div><p class="text-sm font-bold">Narrow AI (exists now)</p></div>
          <p class="text-sm text-zinc-400 font-light">Good at <strong>one specific task</strong>. Chess AI can beat the world champion but can't make a sandwich. ChatGPT can write essays but can't drive a car.</p>
        </div>
        <div class="border border-zinc-800 rounded-sm p-5">

    { type:'info', section:'Neural Networks',
      title:'The Simplest Neuron',
      body:`<p class="text-sm text-zinc-400 font-light leading-relaxed mb-5">One artificial neuron does just three things:</p>
      <div class="bg-zinc-900/50 border border-zinc-800 rounded-sm p-5 mb-5">
        <pre class="text-sm font-mono text-zinc-300 leading-relaxed"><span class="text-yellow-500">Inputs</span>    →  [ 0.5,  0.8,  0.3 ]
<span class="text-yellow-500">Weights</span>   →  × [ 0.2,  0.6, -0.1 ]
<span class="text-blue-400">Sum</span>       →  = 0.1 + 0.48 - 0.03 = <span class="text-yellow-500 font-bold">0.56</span>
<span class="text-green-400">Activation</span> →  is 0.56 > 0.5? <span class="text-green-400 font-bold">Yes → Fire!</span></pre>
      </div>
      <p class="text-sm text-zinc-400 font-light">It multiplies each input by a weight, adds them up, and if the sum is big enough, it "fires." That's it. That's a neuron.</p>`},

    { type:'code', section:'Neural Networks',
      title:'Code Your First Neuron',
      body:`<p class="text-sm text-zinc-400 font-light mb-4">Let's build a neuron in Python. Modify the weights and click "Run" to see the output change:</p>`,
      code:`# A single neuron
inputs = [0.5, 0.8, 0.3]
weights = [0.2, 0.6, -0.1]
threshold = 0.5

# Step 1: Multiply inputs by weights
weighted_sum = sum(i * w for i, w in zip(inputs, weights))

# Step 2: Check if it fires
fires = weighted_sum > threshold

print(f"Weighted sum: {weighted_sum}")
print(f"Fires? {fires}")`,
      expected:'Weighted sum: 0.56\\nFires? True'},

      body:`<p class="text-sm text-zinc-400 font-light leading-relaxed mb-5">Weights are the <strong>most important</strong> part of a neural network. They are numbers that determine how much each input matters.</p>

    { type:'info', section:'Neural Networks',

      body:`<p class="text-sm text-zinc-400 font-light leading-relaxed mb-5">After computing the sum, the neuron passes it through an "activation function." This decides IF and HOW the neuron fires.</p>

    { type:'code', section:'Neural Networks',
      title:'Code: Sigmoid Function',
      body:`<p class="text-sm text-zinc-400 font-light mb-4">The sigmoid function squashes any number into a range between 0 and 1:</p>`,
      code:`import math

def sigmoid(x):
    """Squash any number to 0-1"""
    return 1 / (1 + math.exp(-x))

# Test different values
print(f"sigmoid(-10) = {sigmoid(-10):.4f}")
print(f"sigmoid(-1)  = {sigmoid(-1):.4f}")
print(f"sigmoid(0)   = {sigmoid(0):.4f}")
print(f"sigmoid(1)   = {sigmoid(1):.4f}")
print(f"sigmoid(10)  = {sigmoid(10):.4f}")`,
      expected:'sigmoid\\(-10\\) = 0.0000\\nsigmoid\\(-1\\)  = 0.2689\\nsigmoid\\(0\\)   = 0.5000\\nsigmoid\\(1\\)   = 0.7311\\nsigmoid\\(10\\)  = 1.0000'},

    { type:'code', section:'Neural Networks',
      title:'Code: Build a Mini Network',
      body:`<p class="text-sm text-zinc-400 font-light mb-4">Let's connect 3 neurons into a mini-network that decides if something is "happy":</p>`,
      code:`import math

def sigmoid(x):
    return 1 / (1 + math.exp(-x))

# Inputs: [smile_score, eyes_bright, positive_words]
inputs = [0.9, 0.7, 0.8]

# Hidden layer: 2 neurons
h1_weights = [0.5, 0.3, 0.2]
h2_weights = [0.1, 0.6, 0.4]

h1 = sigmoid(sum(i*w for i,w in zip(inputs, h1_weights)))
h2 = sigmoid(sum(i*w for i,w in zip(inputs, h2_weights)))

# Output layer: 1 neuron
out_weights = [0.7, 0.3]
output = sigmoid(h1 * out_weights[0] + h2 * out_weights[1])

print(f"Hidden 1 (face features): {h1:.3f}")
print(f"Hidden 2 (text sentiment): {h2:.3f}")
print(f"Output (happy?): {output:.3f}")
print(f"Result: {'HAPPY! 😊' if output > 0.5 else 'Not happy 😐'}")`,
      expected:'Hidden 1 \\(face features\\): 0\\.740\\nHidden 2 \\(text sentiment\\): 0\\.711\\nOutput \\(happy\\?:\\) 0\\.731\\nResult: HAPPY! 😊'},

    { type:'info', section:'Training AI',
      title:'The Training Loop',
      body:`<p class="text-sm text-zinc-400 font-light leading-relaxed mb-5">Training an AI is a simple loop repeated thousands of times:</p>
      <div class="flex flex-col items-center gap-3 mb-5">
        <div class="flex items-center gap-3 bg-zinc-900/30 border border-zinc-800 rounded-sm p-4 w-full"><div class="w-8 h-8 rounded-full bg-blue-500/20 border border-blue-500/40 flex items-center justify-center text-xs font-bold text-blue-400">1</div><p class="text-sm text-zinc-300 font-light"><strong>Forward pass:</strong> Show the network an input, get a prediction</p></div>
        <div class="text-zinc-600">↓</div>
        <div class="flex items-center gap-3 bg-zinc-900/30 border border-zinc-800 rounded-sm p-4 w-full"><div class="w-8 h-8 rounded-full bg-red-500/20 border border-red-500/40 flex items-center justify-center text-xs font-bold text-red-400">2</div><p class="text-sm text-zinc-300 font-light"><strong>Calculate error:</strong> Compare prediction to correct answer</p></div>
        <div class="text-zinc-600">↓</div>
        <div class="flex items-center gap-3 bg-zinc-900/30 border border-zinc-800 rounded-sm p-4 w-full"><div class="w-8 h-8 rounded-full bg-yellow-500/20 border border-yellow-500/40 flex items-center justify-center text-xs font-bold text-yellow-400">3</div><p class="text-sm text-zinc-300 font-light"><strong>Backward pass:</strong> Adjust weights to reduce the error</p></div>
        <div class="text-zinc-600">↓</div>
        <div class="flex items-center gap-3 bg-green-500/5 border border-green-500/20 rounded-sm p-4 w-full"><div class="w-8 h-8 rounded-full bg-green-500/20 border border-green-500/40 flex items-center justify-center text-xs font-bold text-green-400">↻</div><p class="text-sm text-zinc-300 font-light"><strong>Repeat</strong> for every example, many times</p></div>

    { type:'info', section:'Training AI',
      title:'The Loss Function (Measuring Error)',
      body:`<p class="text-sm text-zinc-400 font-light leading-relaxed mb-5">The "loss" tells us how wrong the prediction is:</p>
      <div class="bg-zinc-900/50 border border-zinc-800 rounded-sm p-5 mb-5">
        <div class="space-y-3">
          <div class="flex items-center justify-between"><span class="text-sm text-zinc-300 font-light">Predicted: 0.95, Actual: 1.0</span><span class="text-green-400 text-sm font-bold">Loss: 0.0025 ✓</span></div>
          <div class="flex items-center justify-between"><span class="text-sm text-zinc-300 font-light">Predicted: 0.70, Actual: 1.0</span><span class="text-yellow-400 text-sm font-bold">Loss: 0.0900 ~</span></div>
          <div class="flex items-center justify-between"><span class="text-sm text-zinc-300 font-light">Predicted: 0.10, Actual: 1.0</span><span class="text-red-400 text-sm font-bold">Loss: 0.8100 ✗</span></div>
        </div>
      </div>
      <p class="text-sm text-zinc-400 font-light">Goal of training: make the loss as close to <strong>zero</strong> as possible by adjusting weights.</p>`},

    { type:'code', section:'Training AI',
      title:'Code: Calculate Loss',
      body:`<p class="text-sm text-zinc-400 font-light mb-4">The simplest loss function is "mean squared error" — just square the difference:</p>`,
      code:`def mse_loss(predicted, actual):
    """Mean Squared Error"""
    error = predicted - actual
    return error ** 2

# Test different predictions
predictions = [0.95, 0.70, 0.10, 0.01]
actual = 1.0

for p in predictions:
    loss = mse_loss(p, actual)
    bar = "█" * int(loss * 30)
    print(f"Pred: {p:.2f} | Loss: {loss:.4f} {bar}")

print(f"\\nPerfect prediction (1.0): loss = {mse_loss(1.0, 1.0)}")`,
      expected:'Pred: 0\\.95.*Loss: 0\\.0025\\nPred: 0\\.70.*Loss: 0\\.0900\\nPred: 0\\.10.*Loss: 0\\.8100\\nPred: 0\\.01.*Loss: 0\\.9801.*\\nPerfect prediction.*loss = 0\\.0'},

    { type:'info', section:'Training AI',
      title:'Gradient Descent: Finding the Minimum',
      body:`<p class="text-sm text-zinc-400 font-light leading-relaxed mb-5">Imagine you're blindfolded on a mountain and need to reach the valley. What do you do?</p>

      code:`import math

def sigmoid(x):

# Training data: input -> desired output

print(f"Start: weight = {weight:.4f}")
print("-" * 35)

for epoch in range(20):
    total_loss = 0
    for inp, target in training_data:
        # Forward pass
        prediction = sigmoid(inp * weight)
        error = prediction - target
        total_loss += error ** 2
        
        # Backward pass (gradient descent)
        weight -= learning_rate * error * inp * prediction * (1 - prediction)
    
    if epoch % 4 == 0:
        print(f"Epoch {epoch:2d} | weight={weight:.4f} | loss={total_loss:.4f}")

# Test

// Helper to generate section steps
function generateSection(section, prefix, start, end, items) {
    return items.map((item, i) => {
        const num = start + i;
        const isLast = num === end;
        if (item.c && item.c.includes('Code:')) {
            return { type:'code', section, title:item.t, body:`<p class="text-sm text-zinc-400 font-light mb-4">${item.c.replace('Code: ','')}</p>`, code:`# ${item.t}\nprint("Coming soon in interactive editor!")\n# ${item.c}`, expected:'Coming soon' };
        }
        if (item.c && item.c.includes('Lab:')) {
            return { type:'interactive', section, title:item.t, body:`<p class="text-sm text-zinc-400 font-light mb-4">${item.c.replace('Lab: ','')}</p>`, interactiveType:'placeholder-lab', placeholder:item.c.replace('Lab: ','') };
        }
        if (item.c && item.c.includes('Quiz:')) {
            return { type:'quiz', section, title:item.t, question:item.c.replace('Quiz: ',''), options:['Option A','Option B','Option C','Option D'], correct:1, explanation:'Think about what you learned in this section!' };
        }
        return { type:'info', section, title:item.t, body:`<p class="text-sm text-zinc-400 font-light leading-relaxed">${item.c}</p>${isLast?`<div class="mt-6 text-center"><div class="inline-flex items-center gap-2 bg-green-500/10 border border-green-500/20 rounded-full px-4 py-2"><i data-lucide="check-circle" class="w-4 h-4 text-green-500"></i><span class="text-xs font-bold text-green-500">${num}/100 steps</span></div></div>`:''}` };
    });
}

let currentStep = 0;

function getSectionStart(sectionName) {
    for (let i = 0; i < steps.length; i++) {
        if (steps[i].section === sectionName) return i;
    }
    return 0;
}

function renderStep(index) {
    const step = steps[index];
    const container = document.getElementById('step-container');
    let html = `<div class="step-content">`;

    // Section badge
    html += `<div class="flex items-center gap-3 mb-6">
        <span class="text-[10px] font-bold tracking-widest uppercase text-zinc-600">${step.section}</span>
        <div class="flex-1 h-px bg-zinc-800"></div>
        <span class="text-[10px] font-bold tracking-widest uppercase text-zinc-600">Step ${index+1} of 100</span>
    </div>`;

    // Title
    html += `<h1 class="text-2xl md:text-3xl font-bold tracking-tight uppercase leading-tight mb-6">${step.title}</h1>`;

    // Body
    html += step.body;

    // Type-specific additions
    if (step.type === 'code') {
        html += renderCodeBlock(step);
    } else if (step.type === 'quiz') {
        html += renderQuiz(step, index);
    } else if (step.type === 'interactive') {
        html += renderInteractive(step, index);
    }

    html += `</div>`;
    container.innerHTML = html;
    lucide.createIcons();

    // Scroll main to top
    document.getElementById('main-scroll').scrollTop = 0;
}

            </div>
            <textarea class="w-full p-4 text-sm font-mono text-zinc-300 bg-transparent resize-none focus:outline-none leading-relaxed" rows="14" spellcheck="false">${step.code}</textarea>
        </div>
        <div class="mt-3 code-editor rounded-sm p-4">
            <p class="text-[10px] font-bold tracking-widest uppercase text-zinc-600 mb-2">Output</p>
            <pre class="text-sm font-mono text-green-400 leading-relaxed output-area"><span class="text-zinc-600">Click "Run" to see output...</span></pre>
        </div>
    </div>`;
}

function renderQuiz(step, index) {
    let html = `<div class="mt-6 space-y-3">`;
    step.options.forEach((opt, i) => {
        html += `<button onclick="answerQuiz(this, ${i}, ${step.correct}, ${index})" class="quiz-option w-full text-left border border-zinc-800 bg-zinc-900/30 rounded-sm p-4 flex items-center gap-3">
            <span class="w-8 h-8 rounded-full bg-zinc-800 border border-zinc-700 flex items-center justify-center text-xs font-bold text-zinc-400 flex-shrink-0">${String.fromCharCode(65+i)}</span>
            <span class="text-sm text-zinc-300 font-light">${opt}</span>
        </button>`;
    });
    html += `</div><div id="quiz-feedback-${index}" class="mt-4 hidden"></div>`;
    return html;
}

function renderInteractive(step, index) {
    if (step.interactiveType === 'classify') {
        return renderClassifyLab(step, index);
    } else if (step.interactiveType === 'neuron-sliders') {
        return renderNeuronSliders(step, index);
    } else if (step.interactiveType === 'gradient-descent') {
        return renderGradientDescent(step, index);
    } else if (step.interactiveType === 'visual-network') {
        return renderVisualNetwork(step, index);
    }
    return `<div class="mt-6 bg-zinc-900/50 border border-zinc-800 rounded-sm p-8 text-center">
        <div class="text-3xl mb-3">🧪</div>
        <p class="text-sm text-zinc-400 font-light">${step.placeholder || 'Interactive lab — coming soon!'}</p>
        <p class="text-xs text-zinc-600 mt-2">This is a placeholder for the full interactive experience</p>
    </div>`;
}

function renderClassifyLab(step, index) {
    let html = `<div class="mt-6" id="classify-lab-${index}"><div class="grid grid-cols-2 gap-6">`;
    html += `<div><p class="text-[10px] font-bold tracking-widest uppercase text-zinc-500 mb-3">Items to Classify</p><div class="space-y-2" id="classify-items-${index}">`;
    step.items.forEach((item, i) => {
        html += `<button onclick="classifyItem(this,'${step.answers[i]}',${index})" class="w-full text-left border border-zinc-800 bg-zinc-900/30 rounded-sm p-3 text-sm text-zinc-300 font-light hover:border-yellow-500/50 transition-all">${item}</button>`;
    });
    html += `</div></div>`;
    html += `<div><p class="text-[10px] font-bold tracking-widest uppercase text-green-500 mb-3">✓ AI</p><div class="space-y-2 mb-4 min-h-[40px]" id="classify-ai-${index}"></div>`;
    html += `<p class="text-[10px] font-bold tracking-widest uppercase text-zinc-500 mb-3">✗ Not AI</p><div class="space-y-2 min-h-[40px]" id="classify-not-${index}"></div></div>`;
    html += `</div><div id="classify-result-${index}" class="mt-4 hidden"></div></div>`;
    return html;
}

function renderNeuronSliders(step, index) {
    let html = `<div class="mt-6 bg-zinc-900/50 border border-zinc-800 rounded-sm p-6" id="neuron-lab-${index}">`;
    html += `<div class="space-y-4">`;
    step.inputs.forEach((inp, i) => {
        const val = parseFloat(inp.split(': ')[1]);
        html += `<div><div class="flex justify-between mb-1"><span class="text-xs text-zinc-400">${inp}</span><span class="text-xs text-yellow-500 font-mono" id="neuron-w-${index}-${i}">${step.defaultWeights[i].toFixed(2)}</span></div>
        <input type="range" min="-1" max="1" step="0.05" value="${step.defaultWeights[i]}" oninput="updateNeuron(${index})" class="w-full accent-yellow-500" id="neuron-slider-${index}-${i}"></div>`;
    });
    html += `</div>`;
    html += `<div class="mt-5 pt-4 border-t border-zinc-800 text-center">
        <p class="text-[10px] font-bold tracking-widest uppercase text-zinc-600 mb-2">Weighted Sum: <span id="neuron-sum-${index}" class="text-yellow-500">0.18</span> | Threshold: ${step.threshold}</p>
        <div class="mt-3 p-4 rounded-sm" id="neuron-result-${index}"><p class="text-sm text-zinc-400">❌ Neuron does NOT fire</p></div>
    </div></div>`;
    return html;
}

function renderGradientDescent(step, index) {
    return `<div class="mt-6 bg-zinc-900/50 border border-zinc-800 rounded-sm p-6" id="gd-lab-${index}">
        <div class="relative h-48 mb-4">
            <svg viewBox="0 0 300 180" class="w-full h-full">
                <path d="M 10 10 Q 75 170 150 160 Q 225 150 290 10" fill="none" stroke="#27272a" stroke-width="2"/>
                <circle id="gd-ball-${index}" cx="30" cy="50" r="8" fill="#eab308" class="transition-all duration-500"/>
                <text x="150" y="175" text-anchor="middle" fill="#52525b" font-size="10" font-family="Inter">Loss →</text>
                <text x="25" y="8" fill="#52525b" font-size="8" font-family="Inter">High</text>
                <text x="145" y="178" fill="#22c55e" font-size="8" font-family="Inter">Low (minimum)</text>
            </svg>
        </div>
        <div class="flex items-center justify-between">
            <p class="text-xs text-zinc-500">Step: <span id="gd-step-${index}" class="text-yellow-500 font-bold">0</span> | Loss: <span id="gd-loss-${index}" class="text-yellow-500 font-bold">9.50</span></p>
            <button onclick="gdStep(${index})" class="text-[10px] font-bold tracking-wider uppercase bg-yellow-500 text-black px-4 py-2 rounded-sm hover:bg-yellow-400 transition-all">Step ↓</button>
        </div>
    </div>`;
}

function renderVisualNetwork(step, index) {
    let html = `<div class="mt-6 bg-zinc-900/50 border border-zinc-800 rounded-sm p-6" id="vn-lab-${index}">`;
    html += `<div class="flex flex-col items-center gap-4">`;
    // Input layer
    html += `<p class="text-[10px] font-bold tracking-widest uppercase text-blue-400">Input</p><div class="flex gap-4">`;
    step.inputLabels.forEach((l,i) => {
        html += `<button onclick="toggleVNNeuron(${index},'in',${i})" id="vn-in-${index}-${i}" class="w-16 h-16 rounded-full bg-zinc-800 border-2 border-zinc-700 flex flex-col items-center justify-center text-[9px] text-zinc-400 transition-all hover:border-blue-400"><span>${l.split(' ')[0]}</span></button>`;
    });
    html += `</div><div class="text-zinc-700 text-xs">↓ ↓ ↓</div>`;
    // Hidden layer
    html += `<p class="text-[10px] font-bold tracking-widest uppercase text-yellow-400">Hidden</p><div class="flex gap-4">`;
    step.hiddenLabels.forEach((l,i) => {
        html += `<div id="vn-hid-${index}-${i}" class="w-16 h-16 rounded-full bg-zinc-800 border-2 border-zinc-700 flex items-center justify-center text-[9px] text-zinc-500 transition-all"><span>${l.split(' ')[0]}</span></div>`;
    });
    html += `</div><div class="text-zinc-700 text-xs">↓ ↓</div>`;
    // Output
    html += `<p class="text-[10px] font-bold tracking-widest uppercase text-green-400">Output</p>`;
    html += `<div id="vn-out-${index}" class="w-20 h-20 rounded-full bg-zinc-800 border-2 border-zinc-700 flex items-center justify-center text-xs text-zinc-500 font-bold transition-all">0%</div>`;
    html += `</div></div>`;
    return html;
}

// ============================================================
// INTERACTIVE HANDLERS
// ============================================================
function runCode(btn) {
    const textarea = btn.closest('.code-editor').querySelector('textarea');
    const outputArea = btn.closest('.code-editor').parentElement.querySelector('.output-area pre');
    outputArea.innerHTML = `<span class="text-yellow-500">Running...</span>`;
    setTimeout(() => {
        const code = textarea.value;
        const lines = code.split('\n').filter(l => l.includes('print'));
        let output = '';
        lines.forEach(l => {
            const m = l.match(/print\(f?["'](.+?)["']\)/);
            if (m) {
                output += m[1].replace(/\{.*?\}/g, (match) => {
                    if (match.includes('.3f') || match.includes('.4f')) return (Math.random()*0.5+0.5).toFixed(3);
                    if (match.includes('.2f')) return (Math.random()*0.5+0.5).toFixed(2);
                    return 'value';
                }) + '\n';
            }
        });
        if (!output) output = 'Program executed successfully.';
        outputArea.innerHTML = `<span class="output-line">${output.replace(/\n/g,'<br>')}</span>`;
    }, 600);
}

function answerQuiz(btn, selected, correct, index) {
    const parent = btn.parentElement;
    const buttons = parent.querySelectorAll('.quiz-option');
    buttons.forEach((b, i) => {
        b.classList.add('disabled');
        if (i === correct) b.classList.add('correct');
        if (i === selected && i !== correct) b.classList.add('wrong');
    });
    const fb = document.getElementById(`quiz-feedback-${index}`);
    fb.classList.remove('hidden');
    const isCorrect = selected === correct;
    fb.innerHTML = `<div class="${isCorrect ? 'bg-green-500/10 border-green-500/20' : 'bg-red-500/10 border-red-500/20'} border rounded-sm p-4 flex items-start gap-3">
        <i data-lucide="${isCorrect ? 'check-circle' : 'x-circle'}" class="w-5 h-5 ${isCorrect ? 'text-green-500' : 'text-red-500'} mt-0.5 flex-shrink-0"></i>
        <div><p class="text-sm font-bold ${isCorrect ? 'text-green-400' : 'text-red-400'} mb-1">${isCorrect ? 'Correct!' : 'Not quite.'}</p><p class="text-sm text-zinc-400 font-light">${steps[index].explanation}</p></div></div>`;
    lucide.createIcons();
}

function classifyItem(btn, answer, index) {
    btn.style.display = 'none';
    const target = answer === 'AI' ? document.getElementById(`classify-ai-${index}`) : document.getElementById(`classify-not-${index}`);
    target.innerHTML += `<div class="border border-zinc-800 rounded-sm p-2 text-xs text-zinc-300 font-light bg-zinc-900/50">${btn.textContent}</div>`;
    checkClassifyComplete(index);
}

function checkClassifyComplete(index) {
    const items = document.getElementById(`classify-items-${index}`);
    const remaining = items.querySelectorAll('button:not([style*="display: none"])');
    if (remaining.length === 0) {
        const result = document.getElementById(`classify-result-${index}`);
        result.classList.remove('hidden');
        result.innerHTML = `<div class="bg-green-500/10 border border-green-500/20 rounded-sm p-4 flex items-center gap-3"><i data-lucide="check-circle" class="w-5 h-5 text-green-500"></i><p class="text-sm text-green-400 font-bold">All items classified! Great job understanding what counts as AI.</p></div>`;
        lucide.createIcons();
    }
}

function updateNeuron(index) {
    const step = steps[index];
    let sum = 0;
    step.inputs.forEach((inp, i) => {
        const val = parseFloat(inp.split(': ')[1]);
        const w = parseFloat(document.getElementById(`neuron-slider-${index}-${i}`).value);
        document.getElementById(`neuron-w-${index}-${i}`).textContent = w.toFixed(2);
        sum += val * w;
    });
    document.getElementById(`neuron-sum-${index}`).textContent = sum.toFixed(2);
    const result = document.getElementById(`neuron-result-${index}`);
    if (sum > step.threshold) {
        result.innerHTML = `<p class="text-sm text-green-400 font-bold">✅ Neuron FIRES! (sum ${sum.toFixed(2)} > threshold ${step.threshold})</p>`;
        result.className = 'mt-3 p-4 rounded-sm bg-green-500/10 border border-green-500/20';
    } else {
        result.innerHTML = `<p class="text-sm text-zinc-400">❌ Neuron does NOT fire (sum ${sum.toFixed(2)} ≤ threshold ${step.threshold})</p>`;
        result.className = 'mt-3 p-4 rounded-sm bg-zinc-900/50 border border-zinc-800';
    }
}

let gdState = {};
function gdStep(index) {
    if (!gdState[index]) gdState[index] = { step: 0, x: 30 };
    const s = gdState[index];
    s.step++;
    s.x += 20 + Math.random() * 5;
    if (s.x > 280) s.x = 280;
    const loss = Math.max(0, 10 - s.step * 0.9 + Math.random() * 0.3);
    const ball = document.getElementById(`gd-ball-${index}`);
    const y = 10 + (160 * Math.pow(((s.x - 150) / 140), 2));
    ball.setAttribute('cx', s.x);
    ball.setAttribute('cy', Math.min(y, 165));
    document.getElementById(`gd-step-${index}`).textContent = s.step;
    document.getElementById(`gd-loss-${index}`).textContent = loss.toFixed(2);
    if (s.x >= 275) {
        ball.setAttribute('fill', '#22c55e');
    }
}

function toggleVNNeuron(index, layer, i) {
    const el = document.getElementById(`vn-${layer === 'in' ? 'in' : 'hid'}-${index}-${i}`);
    const isOn = el.dataset.on === '1';
    el.dataset.on = isOn ? '0' : '1';
    if (!isOn) {
        el.classList.remove('bg-zinc-800','border-zinc-700','text-zinc-400');
        el.classList.add('bg-blue-500/20','border-blue-400','text-blue-300');
    } else {
        el.classList.add('bg-zinc-800','border-zinc-700','text-zinc-400');
        el.classList.remove('bg-blue-500/20','border-blue-400','text-blue-300');
    }
    // Update hidden + output
    let activeInputs = 0;
    steps[index].inputLabels.forEach((_,j) => {
        if (document.getElementById(`vn-in-${index}-${j}`).dataset.on === '1') activeInputs++;
    });
    const pct = Math.round((activeInputs / steps[index].inputLabels.length) * 100);
    steps[index].hiddenLabels.forEach((_,j) => {
        const h = document.getElementById(`vn-hid-${index}-${j}`);
        if (pct >= 33) {
            h.classList.remove('bg-zinc-800','border-zinc-700','text-zinc-500');
            h.classList.add('bg-yellow-500/20','border-yellow-400','text-yellow-300');
        } else {
            h.classList.add('bg-zinc-800','border-zinc-700','text-zinc-500');
            h.classList.remove('bg-yellow-500/20','border-yellow-400','text-yellow-300');
        }
    });
    const out = document.getElementById(`vn-out-${index}`);
    out.textContent = pct + '%';
    if (pct >= 67) {
        out.classList.remove('bg-zinc-800','border-zinc-700','text-zinc-500');
        out.classList.add('bg-green-500/20','border-green-400','text-green-300');
    } else if (pct >= 33) {
        out.classList.remove('bg-zinc-800','border-zinc-700','text-zinc-500','bg-green-500/20','border-green-400','text-green-300');
        out.classList.add('bg-yellow-500/10','border-yellow-500/40','text-yellow-400');
    } else {
        out.classList.add('bg-zinc-800','border-zinc-700','text-zinc-500');
        out.classList.remove('bg-green-500/20','border-green-400','text-green-300','bg-yellow-500/10','border-yellow-500/40','text-yellow-400');
    }
}

function shareAchievement() {
    if (navigator.share) {
        navigator.share({ title: 'I completed Hour of AI! 🎉', text: 'I just completed the Hour of AI course on CodePulse — 100 steps of learning how AI really works!', url: window.location.href });
    } else {
        navigator.clipboard.writeText('I just completed the Hour of AI course on CodePulse! 🎓 100 steps of learning how AI really works.');
        alert('Copied to clipboard!');
    }
}

// ============================================================
// NAVIGATION
// ============================================================
function goStep(index) {
    if (index < 0 || index >= steps.length) return;
    completedSteps.add(currentStep);
    currentStep = index;
    renderStep(currentStep);
    updateProgress();
    updateStepList();
    document.getElementById('btn-prev').disabled = currentStep === 0;
    document.getElementById('btn-next').innerHTML = currentStep === steps.length - 1
        ? '<span>Finish</span><i data-lucide="check" class="w-4 h-4"></i>'
        : '<span>Next</span><i data-lucide="chevron-right" class="w-4 h-4"></i>';
    lucide.createIcons();
}

function updateProgress() {
    const pct = Math.round(((currentStep + 1) / steps.length) * 100);
    document.getElementById('progress-bar').style.width = pct + '%';
    document.getElementById('progress-text').textContent = `${currentStep + 1}/100`;
    document.getElementById('progress-text-mobile').textContent = pct + '%';
    document.getElementById('sidebar-progress').style.width = pct + '%';
    document.getElementById('sidebar-pct').textContent = pct + '%';
}

function updateStepList() {
    ['step-list','mobile-step-list'].forEach(listId => {
        const list = document.getElementById(listId);
        if (!list) return;
        let html = '';
        let lastSection = '';
        steps.forEach((step, i) => {
            if (step.section !== lastSection) {
                html += `<div class="mt-3 mb-1 px-2"><span class="text-[9px] font-bold tracking-widest uppercase text-zinc-600">${step.section}</span></div>`;
                lastSection = step.section;
            }
            const isActive = i === currentStep;
            const isCompleted = completedSteps.has(i);
            let dotClass = 'w-1.5 h-1.5 rounded-full flex-shrink-0 ';
            if (isActive) dotClass += 'bg-yellow-500 shadow-[0_0_6px_rgba(234,179,8,0.5)]';
            else if (isCompleted) dotClass += 'bg-green-500/60';
            else dotClass += 'bg-zinc-800';
            html += `<button onclick="goStep(${i});toggleMobileSteps(true);" class="w-full flex items-center gap-2.5 px-2 py-1.5 rounded-sm text-left ${isActive ? 'bg-yellow-500/10' : 'hover:bg-zinc-900/50'} transition-colors">
                <div class="${dotClass}"></div>
                <span class="text-[11px] ${isActive ? 'text-yellow-500 font-semibold' : isCompleted ? 'text-zinc-400' : 'text-zinc-600'} truncate">${i+1}. ${step.title}</span>
            </button>`;
        });
        list.innerHTML = html;
    });
}

function toggleMobileSteps(forceClose) {
    const panel = document.getElementById('mobile-steps');
    if (forceClose === true || !panel.classList.contains('hidden')) {
        panel.classList.add('hidden');
        document.body.style.overflow = '';
    } else {
        panel.classList.remove('hidden');
        document.body.style.overflow = 'hidden';
    }
}

// ============================================================
// INIT
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
    goStep(0);
});
</script>
